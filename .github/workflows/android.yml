name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de compilação (Build type)'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - debug
          - release
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'screenshots/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'screenshots/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Compile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clean build cache
        run: ./gradlew clean

      - name: Build APK with Gradle
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'both' }}"
          echo "Selected build type: $BUILD_TYPE"
          
          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew assembleDebug --rerun-tasks
          elif [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleRelease --rerun-tasks
          else
            ./gradlew assembleDebug assembleRelease --rerun-tasks
          fi

      - name: Sign unsigned Release APK (if generated)
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            echo "Generating local debug keystore..."
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" 2>/dev/null | sort -V | tail -n 1)

          for unsigned_apk in $(find app/build/outputs/apk -name "*unsigned.apk"); do
            signed_apk="${unsigned_apk%-unsigned.apk}-signed.apk"
            echo "Signing $unsigned_apk -> $signed_apk"
            
            if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
              "$APKSIGNER" sign --ks ~/.android/debug.keystore --ks-pass pass:android \
                --ks-key-alias androiddebugkey --key-pass pass:android \
                --out "$signed_apk" "$unsigned_apk"
            else
              cp "$unsigned_apk" "$signed_apk"
              jarsigner -keystore ~/.android/debug.keystore -storepass android -keypass android "$signed_apk" androiddebugkey
            fi
            
            rm "$unsigned_apk"
          done

      - name: Upload APKs as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PilcrowMD-APKs
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: error
